# إعداد مؤقت لاستصدار أول شهادة، ثم يُستبدل بـ`gc-service.conf`.
#
# سببه أن الإعداد النهائي يشير إلى ملفات شهادة غير موجودة بعد، وNginx يرفض
# البدء بمرجع مفقود — فلا يعمل، فلا يمر تحدي ACME، فلا تُصدر الشهادة.
#
#   sudo cp gc-service.bootstrap.conf /etc/nginx/sites-available/gc-service
#   sudo ln -s /etc/nginx/sites-available/gc-service /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name gc-service.evavolunteer.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
