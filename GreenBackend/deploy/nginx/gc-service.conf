# gc-service.evavolunteer.com — الواجهة العلنية لـAPI المدن الخضراء.
#
# التطبيق يستمع على 127.0.0.1:4100 من نشر منفذ Compose، فلا يصله طلب إلا
# عبر هذا الملف.
#
# الرقم يجب أن يطابق `API_PORT` في `deploy/.env`. المنفذ 4000 على هذا
# الخادم يشغله تطبيق آخر، وخطأ الرقم هنا يوجّه النطاق إليه لا إلينا.
#
#   sudo cp gc-service.conf /etc/nginx/sites-available/gc-service
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name gc-service.evavolunteer.com;

    # يبقى مفتوحًا بعد الاستصدار: تجديد Let's Encrypt يمر من هنا.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` كمعامل في `listen` لا كتوجيه مستقل: التوجيه المستقل
    # `http2 on;` أُضيف في nginx 1.25.1، والخادم على 1.24 يرفضه بـ
    # "unknown directive" فيسقط اختبار الإعداد كله.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gc-service.evavolunteer.com;

    ssl_certificate     /etc/letsencrypt/live/gc-service.evavolunteer.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gc-service.evavolunteer.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # لا ترويسات أمان هنا: helmet يضبطها في التطبيق، وإضافتها ثانية تُنتج
    # ترويسة مكررة لا طبقة إضافية.

    # حد Express للجسم ميغابايت واحد. ترك هامش هنا يجعل التجاوز يعود
    # بخطأ التطبيق بصيغة problem+json بدل صفحة 413 من Nginx.
    client_max_body_size 2m;

    access_log /var/log/nginx/gc-service.access.log;
    error_log  /var/log/nginx/gc-service.error.log;

    location / {
        proxy_pass http://127.0.0.1:4100;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # تعطيل التخزين المؤقت للطلبات: لا شيء هنا قابل للتخزين، والجلسات
        # تجعل تخزين رد لمستخدم وتسليمه لآخر خطرًا لا تحسينًا.
        proxy_buffering off;
    }
}

# إن وُضع Cloudflare بوضع proxy أمام النطاق فالقفزات تصير اثنتين:
# اضبط `TRUST_PROXY=2` في `.env`، وأضف هنا نطاقات Cloudflare عبر
# `set_real_ip_from` مع `real_ip_header CF-Connecting-IP` — وإلا حُسبت
# حدود المعدل وقفل الدخول على IP الوسيط لا على الزائر.
