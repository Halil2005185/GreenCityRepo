# نشر الباك‌اند على الـVPS: PostgreSQL، ترحيل يسبق الإصدار، الـAPI، وعامل البريد.
#
# يُشغَّل من داخل مجلد `deploy/` كي يلتقط Compose ملف `.env` المجاور تلقائيًا:
#
#   docker compose -f compose.prod.yml up -d --build
#
# لا Nginx هنا: هو على المضيف لأنه المدخل المشترك لهذا النطاق ولنطاقَي
# اللوحة والموقع لاحقًا، ولا معنى لحبسه داخل مشروع الباك‌اند.

name: greencities

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *logging
    # لا `ports`: القاعدة تُرى من شبكة Compose وحدها ولا تلمس واجهة الخادم.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # وظيفة تنتهي، لا خدمة تعمل. الـAPI لا يبدأ قبل نجاحها، فلا يخدم إصدار
  # جديد قاعدةً بمخطط قديم. تكرار التشغيل بلا ضرر: Drizzle يتخطى المطبَّق.
  migrate:
    build:
      context: ..
      target: migrate
    image: greencities-migrate:local
    restart: "no"
    logging: *logging
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      target: runtime
    image: greencities-api:local
    restart: unless-stopped
    logging: *logging
    env_file: .env
    # يستمع داخل الحاوية على 0.0.0.0، ويُنشر على loopback المضيف وحده
    # فلا يصله شيء إلا عبر Nginx.
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # نفس صورة الـAPI بأمر مختلف: إعادة نشر الـAPI لا توقف إرسال الدعوات،
  # وبطء مزوّد البريد لا يشغل خيط الطلبات.
  worker:
    build:
      context: ..
      target: runtime
    image: greencities-api:local
    restart: unless-stopped
    logging: *logging
    env_file: .env
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
