# نشر الباك‌اند على الـVPS: ترحيل ومزامنة تسبقان الإصدار، الـAPI، وعامل البريد.
#
# يُشغَّل من داخل مجلد `deploy/` كي يلتقط Compose ملف `.env` المجاور تلقائيًا،
# وعبر `deploy.sh` لا بـ`up -d` مباشرة — السبب عند خدمة migrate أدناه:
#
#   docker compose -f compose.prod.yml build
#   docker compose -f compose.prod.yml run --rm -T migrate
#   docker compose -f compose.prod.yml up -d --no-deps api worker
#
# لا خدمة PostgreSQL هنا عمدًا. القاعدة عنقود أصلي على المضيف تحت systemd
# (`18/greencities`)، لا حاوية: لا أمر `docker` يصلها — لا `down -v` ولا
# `volume prune` — وترقيات الإصدار تجري بـ`pg_upgradecluster` في مكانها.
# التجهيز والنقل من Neon والنسخ في `database/`، ولا يشغّلها شيء في النشر.
#
# ولا Nginx هنا أيضًا: هو على المضيف لأنه المدخل المشترك لهذا النطاق
# ولنطاقَي اللوحة والموقع لاحقًا.

name: greencities

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# مقبس القاعدة يُركَّب في كل حاوية تتصل بها، فلا تستمع القاعدة على أي واجهة
# شبكة. داخل الحاوية يظهر في `/var/run/postgresql`، وDATABASE_URL يشير إليه بـ
# `?host=/var/run/postgresql`.
#
# المسار على المضيف ليس `/var/run/postgresql`: ذاك على tmpfs يُعاد إنشاؤه عند
# الإقلاع، فيبقى التركيب يشير إلى مجلد محذوف ويضيع المقبس بصمت. التفاصيل في
# database/greencities.conf.
#
# قبل الانتقال عن Neon يُركَّب ولا يُستعمل، وهذا لا يضر: Docker ينشئ المجلد
# فارغًا إن لم يوجد، وsetup-native.sh يضبط ملكيته لاحقًا.
x-pg-socket: &pg-socket "${PG_SOCKET_DIR:-/var/lib/greencities-pgsocket}:/var/run/postgresql"

services:
  # وظيفة تنتهي، لا خدمة تعمل: الترحيل ثم مزامنة الأدوار وقدراتها والمرجعيات
  # الناقصة (`npm run db:deploy`). الـAPI لا يبدأ قبل نجاحها، فلا يخدم إصدار
  # جديد قاعدةً بمخطط قديم ولا بقدرات لم تُمنح بعد. تكرار التشغيل بلا ضرر:
  # Drizzle يتخطى المطبَّق، والمزامنة لا تمس ما حرّره الفريق من اللوحة.
  #
  # `depends_on` أدناه شبكة أمان للتشغيل اليدوي لا ضمانة: `up` يعيد إنشاء
  # api — فيزيل العامل — قبل أن ينتظر نجاح migrate، فيبقى الخادم بلا API إن
  # فشل. لذلك يشغّل `deploy.sh` هذه الخدمة بـ`run --rm` أولًا ثم يرفع api
  # وworker بـ`--no-deps`، وهكذا يجب أن يُفعل يدويًا أيضًا.
  #
  # drizzle-kit يستعمل `DIRECT_URL` إن وُجد وإلا `DATABASE_URL`. على القاعدة
  # المحلية لا فرق بينهما، فيُحذف الأول — وبقاؤه على Neon يجعل الترحيل يجري
  # هناك والتطبيق يقرأ من هنا، ولذلك يرفض deploy.sh النشر في تلك الحالة.
  migrate:
    build:
      context: ..
      target: migrate
    image: greencities-migrate:local
    restart: "no"
    logging: *logging
    env_file: .env
    volumes:
      - *pg-socket

  api:
    build:
      context: ..
      target: runtime
    image: greencities-api:local
    restart: unless-stopped
    logging: *logging
    env_file: .env
    # يستمع داخل الحاوية على 0.0.0.0، ويُنشر على loopback المضيف وحده
    # فلا يصله شيء إلا عبر Nginx.
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - *pg-socket
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # نفس صورة الـAPI بأمر مختلف: إعادة نشر الـAPI لا توقف إرسال الدعوات،
  # وبطء مزوّد البريد لا يشغل خيط الطلبات.
  worker:
    build:
      context: ..
      target: runtime
    image: greencities-api:local
    restart: unless-stopped
    logging: *logging
    env_file: .env
    command: ["node", "dist/worker.js"]
    volumes:
      - *pg-socket
    depends_on:
      migrate:
        condition: service_completed_successfully
