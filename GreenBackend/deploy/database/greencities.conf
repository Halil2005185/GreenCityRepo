# إعدادات عنقود المدن الخضراء — تُثبَّت في conf.d/greencities.conf.
#
# setup-native.sh ينسخها إلى conf.d العنقود المخصص `18/greencities`. لا شيء هنا
# يعدّل postgresql.conf المحزوم، فترقية الحزمة لا تمحو هذه القيم، والرجوع
# عنها حذف ملف واحد. ولأن العنقود مخصص، لا تمس هذه القيم عناقيد المشاريع
# الأخرى على الخادم.
#
# محجّمة لخادم صغير بنواة واحدة يبني صور Docker عند كل نشر، وبيانات صغيرة.
# القيم الافتراضية محجّمة لحاسوب محمول قديم لا لخادم.

# ─────────────────────────────── المقابس ───────────────────────────────
#
# مجلدان عمدًا.
#
# /var/run/postgresql الافتراضي المحزوم، وعليه تعمل كل أدوات المضيف دون
# تغيير — لكنه على tmpfs، فيُمحى عند الإقلاع ويُعاد إنشاؤه. حاوية ركّبته
# ستبقى تشير إلى المجلد القديم المحذوف وتفقد المقبس بصمت.
#
# الثاني مجلد عادي على القرص لا يُعاد إنشاؤه أبدًا، فيبقى تركيب الحاويات له
# صالحًا عبر الإقلاع وإعادة تشغيل Postgres. هو ما تستعمله الحاويات.
# setup-native.sh يستبدل المسار بقيمة PG_SOCKET_DIR.
unix_socket_directories = '/var/run/postgresql,/var/lib/greencities-pgsocket'
# الحاويات تتصل بصفة uid 1000، وليس في مجموعة postgres. صلاحيات المجلد هي ما
# يقيّد الوصول فعلًا، والمقبس لا يصله إلا ما على هذا المضيف.
unix_socket_permissions = 0777

# الـAPI يصل عبر المقبس، فلا سبب للاستماع على واجهة شبكة غير الحلقة المحلية.
listen_addresses = 'localhost'

# ─────────────────────────────── الذاكرة ───────────────────────────────

# تكفي مجموعة العمل كاملة لهذه البيانات. الزيادة تأخذ من بناء صور Docker على
# الخادم نفسه عند كل نشر، وهو أول ما يسقط حين تضيق الذاكرة.
shared_buffers = 256MB
# تلميح للمخطِّط لا حجز: كم يُرجَّح أن يخزّن النظام مؤقتًا. بدونه يتجنب
# المخطِّط فهارس كان يجب أن يستعملها.
effective_cache_size = 1GB
# لكل عقدة فرز أو تجزئة، فالسقف الحقيقي هذا مضروبًا في العمليات المتزامنة.
work_mem = 8MB
# للتنظيف وبناء الفهارس واستعادة النسخ. قصير العمر، فالسخاء فيه يسرّع
# الاستيراد من Neon دون أن يثقل في التشغيل العادي.
maintenance_work_mem = 128MB
# DATABASE_POOL_MAX في deploy/.env هو 20 لكل عملية: الـAPI والعامل، والمزامنة
# أثناء النشر والإصداران القديمان ما زالا يعملان. الباقي لـpsql والنسخ.
max_connections = 100

# ─────────────────────────────── التخزين ───────────────────────────────

# SSD: القراءة العشوائية تكاد تساوي المتسلسلة. القيمة الافتراضية 4.0 تصف
# قرصًا دوّارًا وتجعل المخطِّط يتخطى الفهارس.
random_page_cost = 1.1
effective_io_concurrency = 200

# ─────────────────────────── سجل الكتابة المسبقة ───────────────────────────

# نقاط التفتيش موزعة على الوقت لا دفعة واحدة تحبس الإدخال والإخراج.
checkpoint_completion_target = 0.9
wal_buffers = 8MB
max_wal_size = 1GB
min_wal_size = 256MB

# ─────────────────────────────── المراقبة ───────────────────────────────

# كل استعلام يتجاوز ثانية يدخل السجل. هكذا يُعثر على البطيء قبل أن يصير شكوى.
log_min_duration_statement = 1000
log_checkpoints = on
log_line_prefix = '%m [%p] %q%u@%d '
# إحصاءات الاستعلامات مجمّعة. تحتاج إعادة تشغيل لتُحمَّل، وsetup-native.sh
# ينشئ الامتداد في مخطط `extensions` لا في public — السبب هناك.
shared_preload_libraries = 'pg_stat_statements'
